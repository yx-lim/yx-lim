<svg xmlns="http://www.w3.org/2000/svg" width="620" height="86" viewBox="0 0 620 86" role="img" aria-label="Public repository statistics">
<title>Public repository statistics</title>
<style>
text { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
.ink { fill: #24292f; } .muted { fill: #57606a; }
.accent { fill: #007d75; } .rule { stroke: #d0d7de; }
.empty { fill: #ebedf0; }
@media (prefers-color-scheme: dark) {
 .ink { fill: #f0f6fc; } .muted { fill: #a4adb7; }
 .accent { fill: #59d8c2; } .rule { stroke: #30363d; }
 .empty { fill: #21262d; }
}
</style>
<text x="15" y="41" font-size="28" class="ink" >14</text><text x="15" y="65" font-size="11" class="muted" >public repos</text><text x="222" y="41" font-size="28" class="ink" >9</text><text x="222" y="65" font-size="11" class="muted" >original repos</text><text x="429" y="41" font-size="28" class="ink" >3</text><text x="429" y="65" font-size="11" class="muted" >stars / originals</text>
</svg>
